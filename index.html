<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lavinia & Daniel</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --maroon-900: #4A161E;
    --maroon-800: #5C1F26;
    --cream-050: #FBF7EE;
    --cream-100: #F1E7D6;
    --gold-500: #C9A877;
    --ink-900: #2A1418;
    --ink-500: #7A6266;
    --line: #DACBAE;
    --surface: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream-050);
    color: var(--ink-900);
    font-family: 'Jost', ui-sans-serif, system-ui, sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    text-align: center;
  }
  .script { font-family: 'Herr Von Muellerhoff', cursive; font-size: clamp(3.2rem, 10vw, 5.5rem); color: var(--maroon-900); line-height: 1; margin-bottom: 0.6rem; }
  .amp { color: var(--gold-500); }
  .sub { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: var(--ink-500); margin-bottom: 3rem; letter-spacing: 0.02em; }
  .cards { display: flex; flex-wrap: wrap; gap: 1.5rem; justify-content: center; max-width: 760px; }
  .card {
    flex: 1 1 300px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 2.2rem 1.8rem;
    text-decoration: none;
    color: var(--ink-900);
    box-shadow: 0 20px 50px -30px rgba(42,20,24,0.35);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 24px 55px -28px rgba(42,20,24,0.45); }
  .card .eyebrow { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-500); font-weight: 500; }
  .card h2 { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 2rem; margin: 0.6rem 0 0.4rem; }
  .card .date { font-family: 'IBM Plex Mono', monospace; font-size: 0.88rem; color: var(--ink-500); }
  .card .go { display: inline-block; margin-top: 1.2rem; font-size: 0.85rem; border-bottom: 1px dotted var(--gold-500); padding-bottom: 2px; }
  footer { margin-top: 3rem; font-size: 0.8rem; color: var(--ink-500); }
</style>
</head>
<body>
  <div class="script">Lavinia <span class="amp">&amp;</span> Daniel</div>
  <div class="sub" data-i18n="index.sub">Join us as we celebrate — pick an event below</div>

  <div class="cards">
    <a class="card" href="canada.html">
      <div class="eyebrow" data-i18n="index.ca.eyebrow">Canada</div>
      <h2 data-i18n="index.ca.title">Celebration Canada</h2>
      <div class="date" data-i18n="index.ca.date">Sunday, October 11, 2026 · 1:00 – 5:00 PM</div>
      <div class="go" data-i18n="index.go">Schedule &amp; day-of team →</div>
    </a>
    <a class="card" href="switzerland.html">
      <div class="eyebrow" data-i18n="index.ch.eyebrow">Switzerland</div>
      <h2 data-i18n="index.ch.title">Trauung &amp; Feier</h2>
      <div class="date" data-i18n="index.ch.date">Saturday, October 17, 2026 · 1:00 PM</div>
      <div class="go" data-i18n="index.go">Schedule &amp; day-of team →</div>
    </a>
  </div>

  <footer>Lavinia &amp; Daniel · 2026</footer>

<script>
window.I18N_PAGE = { de: {
  "index.sub": "Feiere mit uns — wähle unten einen Anlass",
  "index.ca.eyebrow": "Kanada",
  "index.ca.title": "Feier Kanada",
  "index.ca.date": "Sonntag, 11. Oktober 2026 · 13:00 – 17:00",
  "index.ch.eyebrow": "Schweiz",
  "index.ch.title": "Trauung &amp; Feier",
  "index.ch.date": "Samstag, 17. Oktober 2026 · 13:00",
  "index.go": "Programm &amp; Team vor Ort →"
} };
</script>
<script src="assets/i18n.js"></script>
</body>
</html>
